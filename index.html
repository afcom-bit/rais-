<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <title>Radio Islam Sragen</title>

    <link rel="manifest" href="manifest.json">

    <meta name="theme-color" content="#1b4d3e">

    <meta
        name="apple-mobile-web-app-capable"
        content="yes">

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent">


    <style>


        /* =====================================================
           BODY
        ===================================================== */

        html,
        body {

            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            background:
                linear-gradient(
                    135deg,
                    #0e0e0e 0%,
                    #1b4d3e 100%
                );

            color: #ffffff;

            font-family:
                'Segoe UI',
                Tahoma,
                Geneva,
                Verdana,
                sans-serif;

            display: flex;

            align-items: center;
            justify-content: center;

            overflow: hidden !important;

            position: fixed;

            touch-action: none;

            user-select: none;

            box-sizing: border-box;
        }


        /* =====================================================
           FRAME SAMSUNG JADUL
        ===================================================== */

        .android-phone {

            position: relative;

            width: 360px;

            height: auto;

            padding: 0;

            background:
                linear-gradient(
                    145deg,
                    #CFEFE0 0%,
                    #E8F5E9 50%,
                    #FFF3D6 100%
                );

            border:
                3px solid #D8CBAA;

            border-radius: 42px;

            box-shadow:

                0 20px 50px
                rgba(0,0,0,0.60),

                inset 0 0 0 1px
                rgba(255,255,255,0.8),

                inset 0 0 20px
                rgba(255,255,255,0.35);

            overflow: hidden;

            box-sizing: border-box;
        }


        /* =====================================================
           BAGIAN ATAS HP
        ===================================================== */

        .phone-top {

            position: relative;

            width: 100%;

            height: 42px;

            display: flex;

            align-items: center;

            justify-content: center;

            box-sizing: border-box;
        }


        /* Speaker Samsung lama */

        .speaker {

            width: 62px;

            height: 8px;

            background:
                linear-gradient(
                    180deg,
                    #303030,
                    #090909
                );

            border-radius: 8px;

            box-shadow:
                inset 0 1px 2px
                rgba(255,255,255,0.25),

                0 1px 2px
                rgba(0,0,0,0.5);
        }


        /* Kamera depan */

        .front-camera {

            position: absolute;

            left: calc(50% + 45px);

            top: 17px;

            width: 7px;

            height: 7px;

            background:
                radial-gradient(
                    circle at 35% 35%,
                    #536b76,
                    #101719 60%,
                    #000000 100%
                );

            border-radius: 50%;

            box-shadow:
                0 0 3px
                rgba(0,0,0,0.7);
        }


        /* =====================================================
           LCD / LAYAR HP
        ===================================================== */

        .phone-screen {

            position: relative;

            width: calc(100% - 10px);

            margin: 0 auto;

            height: auto;

            box-sizing: border-box;

            border-radius: 20px;

            overflow: hidden;

            background:
                linear-gradient(
                    135deg,
                    #0e0e0e 0%,
                    #1b4d3e 100%
                );

            padding-top: 10px;

            padding-bottom: 10px;

            box-shadow:

                inset 0 0 0 2px
                rgba(0,0,0,0.55),

                inset 0 0 12px
                rgba(0,0,0,0.45);
        }


        /* =====================================================
           KARTU UTAMA
        ===================================================== */

        .player-card {

            background:

                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.28) 0%,
                    rgba(255,255,255,0.08) 40%,
                    rgba(255,255,255,0.35) 45%,
                    rgba(255,255,255,0.05) 52%,
                    rgba(255,255,255,0.15) 100%
                ),

                rgba(255,255,255,0.22);

            backdrop-filter:
                blur(20px);

            -webkit-backdrop-filter:
                blur(20px);

            border:
                1px solid
                rgba(255,255,244,0.6);

            padding:
                25px;

            border-radius:
                20px;

            box-shadow:

                inset 0 1px 2px
                rgba(255,255,255,0.6),

                inset 0 -1px 2px
                rgba(255,255,255,0.2),

                0 10px 25px
                rgba(0,0,0,0.5),

                0 0 18px 2px
                rgba(255,255,255,0.18);

            text-align: center;

            width: 100%;

            border-top:
                5px solid #F8FFFD;

            box-sizing:
                border-box;

            touch-action:
                none;

            margin:
                0 auto;
        }


        /* =====================================================
           AREA LOGO
        ===================================================== */

        .logo-area {

            position: relative;

            width: 100%;

            height: 250px;

            margin-bottom: 20px;
        }


        /* =====================================================
           LOGO
        ===================================================== */

        .logo-placeholder {

            position: absolute;

            width:
                calc(100% + 10px);

            height:
                250px;

            left:
                -5px;

            top:
                5px;

            background:
                linear-gradient(
                    135deg,
                    #FFDF92 0%,
                    #CAA347 100%
                );

            border-radius:
                15px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            overflow:
                hidden;

            box-shadow:
                0 0 20px
                rgba(202,163,71,0.4);

            z-index:
                1;
        }


        .logo-placeholder img {

            width:
                100%;

            height:
                100%;

            object-fit:
                cover;

            display:
                block;
        }


        /* =====================================================
           RAIS
        ===================================================== */

        .station-sub {

            position: absolute;

            left:
                0;

            right:
                0;

            top:
                -14px;

            margin:
                0;

            font-size:
                14px;

            line-height:
                14px;

            color:
                #F8FFFD;

            font-family:
                'Segoe UI',
                Tahoma,
                Geneva,
                Verdana,
                sans-serif;

            font-weight:
                600;

            z-index:
                3;

            text-align:
                center;
        }


        /* =====================================================
           FRAME SUMBER SUARA
        ===================================================== */

        .iframe-container {

            position:
                absolute;

            left:
                0;

            bottom:
                5px;

            width:
                100%;

            height:
                83px;

            border-radius:
                12px;

            overflow:
                hidden !important;

            background:
                transparent !important;

            border:
                1px solid
                rgba(255,255,254,0.4);

            z-index:
                4;

            --crop-left:
                -50px;

            --crop-top:
                -135px;
        }


        iframe {

            position:
                absolute;

            width:
                480px;

            height:
                445px;

            border:
                none;

            overflow:
                hidden !important;

            touch-action:
                none;

            left:
                var(--crop-left);

            top:
                var(--crop-top);

            z-index:
                5;
        }


        /* =====================================================
           INFORMASI
        ===================================================== */

        .info-text-container {

            width:
                100%;

            height:
                auto;

            max-height:
                352px;

            overflow-y:
                auto;

            overflow-x:
                hidden;

            text-align:
                justify;

            font-size:
                16px;

            line-height:
                1.3;

            color:
                #FFFFF4;

            word-wrap:
                break-word;

            white-space:
                normal;

            padding:
                0 15px;

            box-sizing:
                border-box;

            user-select:
                text;

            touch-action:
                pan-y;
        }


        .info-text-container p {

            margin:
                0 0 4px 0;

            min-height:
                20.8px;
        }


        .info-text-container p:last-child {

            margin-bottom:
                0;
        }


        .info-text-container::-webkit-scrollbar {

            width:
                4px;
        }


        .info-text-container::-webkit-scrollbar-thumb {

            background:
                #CAA347;

            border-radius:
                10px;
        }


        /* =====================================================
           DEVELOPER
        ===================================================== */

        .dev-tag {

            text-align:
                center;

            font-size:
                13px;

            color:
                #EDDDB8;

            margin-top:
                21px;

            width:
                100%;

            font-weight:
                400;

            letter-spacing:
                0.5px;

            user-select:
                none;
        }


        /* =====================================================
           NAVIGASI SAMSUNG JADUL
        ===================================================== */

        .phone-bottom {

            position: relative;

            width: 100%;

            height: 58px;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 42px;

            box-sizing: border-box;
        }


        /* Tombol kiri dan kanan */

        .nav-button {

            width: 28px;

            height: 28px;

            border-radius: 50%;

            background:
                linear-gradient(
                    145deg,
                    #E8F5E9,
                    #CFEFE0
                );

            border:
                1px solid
                rgba(120,140,125,0.55);

            box-shadow:

                inset 0 1px 2px
                rgba(255,255,255,0.8),

                0 2px 4px
                rgba(0,0,0,0.35);

            display: flex;

            align-items: center;

            justify-content: center;

            cursor: pointer;

            transition:
                transform 0.12s,
                box-shadow 0.12s;
        }


        .nav-button:active {

            transform:
                scale(0.90);

            box-shadow:
                inset 0 2px 3px
                rgba(0,0,0,0.25);
        }


        /* Simbol tombol kiri */

        .nav-button.left::before {

            content: "☰";

            font-size: 15px;

            color: #315546;
        }


        /* Simbol tombol kanan */

        .nav-button.right::before {

            content: "×";

            font-size: 21px;

            font-weight: 600;

            color: #315546;
        }


        /* =====================================================
           TOMBOL HOME FISIK
        ===================================================== */

        .home-button {

            width: 62px;

            height: 32px;

            border-radius: 10px;

            background:
                linear-gradient(
                    145deg,
                    #FFF3D6,
                    #D8CBAA
                );

            border:
                1px solid
                rgba(130,115,85,0.65);

            box-shadow:

                inset 0 1px 2px
                rgba(255,255,255,0.9),

                inset 0 -2px 3px
                rgba(0,0,0,0.15),

                0 2px 5px
                rgba(0,0,0,0.35);

            display: flex;

            align-items: center;

            justify-content: center;

            cursor: pointer;

            transition:
                transform 0.12s;
        }


        .home-button:active {

            transform:
                scale(0.94);
        }


        .home-inner {

            width: 13px;

            height: 13px;

            border:
                2px solid #8C8062;

            border-radius: 3px;

            box-sizing: border-box;
        }


        /* =====================================================
           MENU SHARE
        ===================================================== */

        .share-menu {

            position: fixed;

            left: 50%;

            top: 50%;

            transform:
                translate(-50%, -50%);

            width: 280px;

            padding: 20px;

            background:
                linear-gradient(
                    145deg,
                    #CFEFE0,
                    #FFF3D6
                );

            border:
                2px solid #D8CBAA;

            border-radius: 22px;

            box-shadow:
                0 15px 45px
                rgba(0,0,0,0.65);

            z-index: 1000;

            display: none;

            text-align: center;

            color: #244438;

            box-sizing: border-box;
        }


        .share-menu.active {

            display: block;
        }


        .share-title {

            font-size: 18px;

            font-weight: 700;

            margin-bottom: 15px;
        }


        .share-button {

            width: 100%;

            height: 42px;

            margin-top: 8px;

            border: none;

            border-radius: 12px;

            background:
                linear-gradient(
                    145deg,
                    #E8F5E9,
                    #FFF3D6
                );

            color: #244438;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            box-shadow:
                0 2px 5px
                rgba(0,0,0,0.2);
        }


        .share-button:active {

            transform:
                scale(0.97);
        }


        /* =====================================================
           LAPIS GELAP MENU
        ===================================================== */

        .menu-overlay {

            position: fixed;

            inset: 0;

            background:
                rgba(0,0,0,0.55);

            z-index: 999;

            display: none;
        }


        .menu-overlay.active {

            display: block;
        }


        /* =====================================================
           LAYAR EXIT
        ===================================================== */

        .exit-screen {

            position: fixed;

            inset: 0;

            background:
                linear-gradient(
                    135deg,
                    #0e0e0e,
                    #1b4d3e
                );

            z-index: 2000;

            display: none;

            align-items: center;

            justify-content: center;

            flex-direction: column;

            text-align: center;

            color: #F8FFFD;
        }


        .exit-screen.active {

            display: flex;
        }


        .exit-logo {

            width: 110px;

            height: 110px;

            border-radius: 20px;

            overflow: hidden;

            margin-bottom: 20px;

            box-shadow:
                0 8px 25px
                rgba(0,0,0,0.5);
        }


        .exit-logo img {

            width: 100%;

            height: 100%;

            object-fit: cover;
        }


        .exit-title {

            font-size: 21px;

            font-weight: 600;

            margin-bottom: 8px;
        }


        .exit-text {

            font-size: 14px;

            opacity: 0.8;
        }


        .exit-back {

            margin-top: 25px;

            padding: 11px 25px;

            border: none;

            border-radius: 20px;

            background: #FFF3D6;

            color: #244438;

            font-weight: 600;

            cursor: pointer;
        }


    </style>
</head>


<body>


    <!-- =====================================================
         FRAME SAMSUNG
    ===================================================== -->

    <div class="android-phone">


        <!-- =================================================
             BAGIAN ATAS
        ================================================= -->

        <div class="phone-top">

            <div class="speaker"></div>

            <div class="front-camera"></div>

        </div>


        <!-- =================================================
             LCD
        ================================================= -->

        <div class="phone-screen">


            <div class="player-card">


                <!-- =========================================
                     LOGO
                ========================================== -->

                <div class="logo-area">


                    <div class="logo-placeholder">

                        <img
                            src="./icon-192.png"
                            alt="Radio Islam Sragen">

                    </div>


                    <p class="station-sub">
                        RAIS
                    </p>


                    <!-- SUMBER SUARA -->

                    <div class="iframe-container">


                        <iframe
                            src="https://streamy1.radioislam.my.id/player/sragen-s-station/"
                            allow="autoplay; encrypted-media"
                            scrolling="no"
                            title="Streamy Player">
                        </iframe>


                    </div>

                </div>


                <!-- =========================================
                     INFORMASI
                ========================================== -->

                <div class="info-text-container">

                    <p></p>
                    <p></p>
                    <p></p>
                    <p></p>
                    <p> </p>
                    <p></p>
                    <p></p>
                    <p></p>
                    <p></p>
                    <p></p>
                    <p></p>
                    <p></p>
                    <p></p>
                    <p></p>
                    <p></p>
                    <p></p>
                    <p></p>

                </div>

                <!-- =========================================
                     DEVELOPER
                ========================================== -->

                <div class="dev-tag">
                    dev.@fcom
                </div>


            </div>


        </div>


        <!-- =================================================
             TOMBOL NAVIGASI
        ================================================= -->

        <div class="phone-bottom">


            <!-- SHARE -->

            <div
                class="nav-button left"
                id="shareButton"
                title="Share">
            </div>


            <!-- HOME -->

            <div
                class="home-button"
                id="homeButton"
                title="Home">

                <div class="home-inner"></div>

            </div>


            <!-- EXIT -->

            <div
                class="nav-button right"
                id="exitButton"
                title="Exit">
            </div>


        </div>


    </div>


    <!-- =====================================================
         OVERLAY MENU
    ===================================================== -->

    <div
        class="menu-overlay"
        id="menuOverlay">
    </div>


    <!-- =====================================================
         MENU SHARE
    ===================================================== -->

    <div
        class="share-menu"
        id="shareMenu">


        <div class="share-title">
            Bagikan Radio Islam Sragen
        </div>


        <button
            class="share-button"
            id="systemShare">

            📤 Bagikan Link

        </button>


        <button
            class="share-button"
            id="copyLink">

            🔗 Salin Link

        </button>


        <button
            class="share-button"
            id="closeShare">

            ✕ Tutup

        </button>


    </div>


    <!-- =====================================================
         EXIT SCREEN
    ===================================================== -->

    <div
        class="exit-screen"
        id="exitScreen">


        <div class="exit-logo">

            <img
                src="./icon-192.png"
                alt="Radio Islam Sragen">

        </div>


        <div class="exit-title">
            Radio Islam Sragen
        </div>


        <div class="exit-text">
            Terima kasih telah mendengarkan.
        </div>


        <button
            class="exit-back"
            id="exitBack">

            Kembali

        </button>


    </div>


    <!-- =====================================================
         SCRIPT
    ===================================================== -->

    <script>


        /* =================================================
           RAPikan INFORMASI
        ================================================= */

        function rapikanTextContainer() {


            const container =
                document.querySelector(
                    '.info-text-container'
                );


            if (!container)
                return;


            const paragraphs =
                Array.from(
                    container.querySelectorAll('p')
                );


            let lastFilled =
                -1;


            for (
                let i = 0;
                i < paragraphs.length;
                i++
            ) {


                const teks =
                    paragraphs[i]
                        .textContent
                        .trim();


                if (teks !== '') {

                    lastFilled =
                        i;

                }

            }


            paragraphs.forEach(
                (p, index) => {


                    if (
                        index >
                        lastFilled
                    ) {

                        p.style.display =
                            'none';

                    } else {

                        p.style.display =
                            '';

                    }

                }
            );


            container.style.height =
                'auto';


            const tinggi =
                container.scrollHeight;


            if (
                tinggi >
                352
            ) {

                container.style.height =
                    '352px';

            } else {

                container.style.height =
                    tinggi + 'px';

            }

        }


        /* =================================================
           MENU SHARE
        ================================================= */

        const shareButton =
            document.getElementById(
                'shareButton'
            );


        const shareMenu =
            document.getElementById(
                'shareMenu'
            );


        const menuOverlay =
            document.getElementById(
                'menuOverlay'
            );


        const closeShare =
            document.getElementById(
                'closeShare'
            );


        function bukaShare() {

            shareMenu.classList.add(
                'active'
            );

            menuOverlay.classList.add(
                'active'
            );

        }


        function tutupShare() {

            shareMenu.classList.remove(
                'active'
            );

            menuOverlay.classList.remove(
                'active'
            );

        }


        shareButton.addEventListener(
            'click',
            bukaShare
        );


        closeShare.addEventListener(
            'click',
            tutupShare
        );


        menuOverlay.addEventListener(
            'click',
            tutupShare
        );


        /* =================================================
           SHARE SISTEM HP
        ================================================= */

        document.getElementById(
            'systemShare'
        ).addEventListener(
            'click',
            async function() {


                const link =
                    window.location.href;


                if (
                    navigator.share
                ) {


                    try {

                        await navigator.share({

                            title:
                                'Radio Islam Sragen',

                            text:
                                'Dengarkan Radio Islam Sragen',

                            url:
                                link

                        });

                    }

                    catch (error) {

                        console.log(
                            'Share dibatalkan'
                        );

                    }


                } else {


                    try {

                        await navigator.clipboard.writeText(
                            link
                        );

                        alert(
                            'Link Radio Islam Sragen berhasil disalin.'
                        );

                    }

                    catch (error) {

                        alert(
                            link
                        );

                    }

                }

            }
        );


        /* =================================================
           SALIN LINK
        ================================================= */

        document.getElementById(
            'copyLink'
        ).addEventListener(
            'click',
            async function() {


                const link =
                    window.location.href;


                try {

                    await navigator.clipboard.writeText(
                        link
                    );

                    alert(
                        'Link berhasil disalin.'
                    );

                }

                catch (error) {

                    prompt(
                        'Salin link berikut:',
                        link
                    );

                }

            }
        );


        /* =================================================
           HOME
        ================================================= */

        document.getElementById(
            'homeButton'
        ).addEventListener(
            'click',
            function() {


                tutupShare();


                document.getElementById(
                    'exitScreen'
                ).classList.remove(
                    'active'
                );


                window.scrollTo(
                    0,
                    0
                );

            }
        );


        /* =================================================
           EXIT
        ================================================= */

        document.getElementById(
            'exitButton'
        ).addEventListener(
            'click',
            function() {


                tutupShare();


                const exitScreen =
                    document.getElementById(
                        'exitScreen'
                    );


                exitScreen.classList.add(
                    'active'
                );


                /*
                 * Browser biasanya tidak mengizinkan
                 * halaman web menutup dirinya sendiri.
                 * Karena itu kita mencoba window.close()
                 * terlebih dahulu.
                 */

                setTimeout(
                    function() {

                        try {

                            window.close();

                        }

                        catch (error) {

                            console.log(
                                'Browser tidak mengizinkan close.'
                            );

                        }

                    },
                    300
                );

            }
        );


        /* =================================================
           KEMBALI DARI EXIT
        ================================================= */

        document.getElementById(
            'exitBack'
        ).addEventListener(
            'click',
            function() {

                document.getElementById(
                    'exitScreen'
                ).classList.remove(
                    'active'
                );

            }
        );


        /* =================================================
           DOM READY
        ================================================= */

        document.addEventListener(
            'DOMContentLoaded',
            function() {

                rapikanTextContainer();

            }
        );


        /* =================================================
           MENCEGAH ZOOM
        ================================================= */

        document.addEventListener(
            'touchmove',
            function(e) {


                if (
                    e.target.closest(
                        '.info-text-container'
                    )
                ) {

                    return;

                }


                if (
                    e.scale !== 1
                ) {

                    e.preventDefault();

                }

            },
            {
                passive:
                    false
            }
        );


        /* =================================================
           SERVICE WORKER
        ================================================= */

        if (
            'serviceWorker'
            in navigator
        ) {


            window.addEventListener(
                'load',
                () => {


                    navigator.serviceWorker
                        .register('./sw.js')


                        .then(
                            reg =>
                                console.log(
                                    'PWA Manual Crop Sukses Diaktifkan!'
                                )
                        )


                        .catch(
                            err =>
                                console.log(
                                    'PWA Gagal:',
                                    err
                                )
                        );


                }
            );

        }


    </script>

</body>
