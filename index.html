<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Radio Islam Sragen</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#071b15">

<style>
*{box-sizing:border-box}
html,body{
    margin:0;
    width:100%;
    min-height:100%;
    background:#020b08;
    font-family:"Segoe UI",Arial,sans-serif;
}
body{
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    color:#fff;
}
.app{
    width:360px;
    min-height:620px;
    max-height:100vh;
    background:
        radial-gradient(circle at 50% -10%,#245d4b 0,#0d2e24 38%,#03100c 100%);
    border-radius:28px;
    overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.65);
    position:relative;
    display:flex;
    flex-direction:column;
}

.header{
    height:58px;
    padding:0 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:rgba(0,0,0,.18);
    border-bottom:1px solid rgba(255,255,255,.08);
}
.brand{
    display:flex;
    align-items:center;
    gap:9px;
    font-size:16px;
    font-weight:700;
    letter-spacing:.5px;
}
.live-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:#ff4545;
    box-shadow:0 0 10px #ff4545;
}
.menu{
    font-size:23px;
    opacity:.8;
}

.content{
    flex:1;
    overflow-y:auto;
    padding:18px 15px 12px;
    scrollbar-width:none;
}
.content::-webkit-scrollbar{display:none}

.logo-area{
    width:100%;
    height:235px;
    border-radius:22px;
    overflow:hidden;
    position:relative;
    background:linear-gradient(145deg,#d9c88e,#f2e7bc,#a99455);
    box-shadow:0 12px 30px rgba(0,0,0,.35);
}
.logo-area img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}
.live-label{
    position:absolute;
    left:14px;
    top:14px;
    padding:6px 10px;
    border-radius:20px;
    background:rgba(130,0,0,.9);
    font-size:11px;
    font-weight:700;
    letter-spacing:.8px;
}

.station{
    text-align:center;
    padding:15px 0 12px;
}
.station h1{
    margin:0;
    font-size:20px;
    letter-spacing:.4px;
}
.station p{
    margin:5px 0 0;
    font-size:12px;
    color:#c8d8d2;
}

.player-wrap{
    width:100%;
    margin:0 0 14px;
}

/* KARTU SUARA / IFRAME TETAP */
.iframe-container{
    position:relative;
    width:100%;
    height:83px;
    border-radius:12px;
    overflow:hidden;
    background:transparent;
    border:1px solid rgba(255,255,254,.4);
    --crop-left:-50px;
    --crop-top:-135px;
    z-index:4;
}
.iframe-container iframe{
    width:480px;
    height:445px;
    position:absolute;
    left:var(--crop-left);
    top:var(--crop-top);
    border:0;
    overflow:hidden;
}

.info-card{
    background:rgba(255,255,255,.07);
    border:1px solid rgba(255,255,255,.09);
    border-radius:18px;
    padding:14px 13px;
    box-shadow:0 8px 20px rgba(0,0,0,.2);
}
.info-title{
    font-size:12px;
    font-weight:700;
    color:#e4d39b;
    margin-bottom:8px;
}
.info-text-container{
    width:100%;
    max-height:250px;
    overflow-y:auto;
    font-size:14px;
    line-height:1.35;
    color:#f1f5f3;
    padding:0 2px;
    scrollbar-width:none;
    user-select:text;
    touch-action:pan-y;
}
.info-text-container::-webkit-scrollbar{display:none}
.info-text-container p{
    margin:0 0 4px;
    min-height:18px;
}

.footer{
    height:50px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#b9c8c2;
    font-size:11px;
    background:rgba(0,0,0,.2);
    border-top:1px solid rgba(255,255,255,.06);
}

.dev{
    color:#d8c78e;
}

@media(max-height:650px){
    .app{min-height:100vh;border-radius:0}
    .logo-area{height:190px}
    .content{padding-top:12px}
}
</style>
</head>

<body>

<div class="app">

    <header class="header">
        <div class="brand">
            <span class="live-dot"></span>
            RADIO ISLAM SRAGEN
        </div>
        <div class="menu">⋮</div>
    </header>

    <main class="content">

        <div class="logo-area">
            <img src="./icon-192.png" alt="Radio Islam Sragen">
            <div class="live-label">● LIVE</div>
        </div>

        <div class="station">
            <h1>Radio Islam Sragen</h1>
            <p>Teman dalam ilmu dan kebaikan</p>
        </div>

        <div class="player-wrap">

            <!-- KARTU SUARA / IFRAME TIDAK DIUBAH -->
            <div class="iframe-container">
                <iframe
                    src="https://streamy1.radioislam.my.id/player/sragen-s-station/"
                    allow="autoplay; encrypted-media"
                    scrolling="no"
                    title="Streamy Player">
                </iframe>
            </div>

        </div>

        <div class="info-card">
            <div class="info-title">📻 INFORMASI SIARAN</div>

            <div class="info-text-container">

                <p>══════📻🆁🅰🅸🆂</p>
                <p></p>
                <p>📚 Qasidah</p>
                <p>   Unwanulhikam</p>
                <p>🎙 Al-Ustadz  Usamah  bin</p>
                <p>   Faishol Mahri  حفظه ا لله</p>
                <p></p>
                <p>📚 Tausiyah</p>
                <p>🎙 Al-Ustadz Huda حفظه ا لله</p>
                <p></p>
                <p>📌 Masjid Alfalah, Sragen</p>
                <p>   Ahad Tgl 20 Juli 2025</p>
                <p></p>
                <p></p>
                <p></p>
                <p></p>

            </div>
        </div>

    </main>

    <footer class="footer">
        <span class="dev">dev.@fcom</span>
    </footer>

</div>

<script>
function rapikanTextContainer(){
    const box=document.querySelector(".info-text-container");
    if(!box)return;

    const p=[...box.querySelectorAll("p")];

    let last=-1;
    p.forEach((el,i)=>{
        if(el.textContent.trim()!=="")last=i;
    });

    p.forEach((el,i)=>{
        el.style.display=i>last?"none":"block";
    });

    box.style.height=Math.min(box.scrollHeight,250)+"px";
}

document.addEventListener("DOMContentLoaded",rapikanTextContainer);

document.addEventListener("touchmove",function(e){
    const info=e.target.closest(".info-text-container");
    if(!info)e.preventDefault();
},{passive:false});

if("serviceWorker" in navigator){
    window.addEventListener("load",()=>{
        navigator.serviceWorker.register("./sw.js")
        .then(()=>console.log("PWA Manual Crop Sukses Diaktifkan!"))
        .catch(err=>console.log("Service Worker gagal:",err));
    });
}
</script>

</body>
</html>
