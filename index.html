<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Radio Islam Sragen</title>
    
    <!-- Tag Icon (Favicon) Browser -->
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="favicon.ico">

    <!-- Hubungkan ke file Manifest PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1b4d3e">
    <!-- Pengaturan Khusus iOS/Safari PWA Standalone -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        /* KUNCI TOTAL LAYAR UTAMA */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0e0e0e 0%, #1b4d3e 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 10px; 
            overflow: hidden !important;
            position: fixed;
            touch-action: none;
            user-select: none;
            box-sizing: border-box;
        }

        /* Kartu Pemutar Terkunci Presisi */
        .player-card {
            background: 
                linear-gradient(135deg, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0.08) 40%, rgba(255, 255, 255, 0.35) 45%, rgba(255, 255, 255, 0.05) 52%, rgba(255, 255, 255, 0.15) 100%),
                rgba(255, 255, 255, 0.22);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 244, 0.6);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 
                inset 0 1px 2px rgba(255, 255, 255, 0.6),
                inset 0 -1px 2px rgba(255, 255, 255, 0.2),
                0 10px 25px rgba(0,0,0,0.5),
                0 0 18px 2px rgba(255, 255, 255, 0.18);
            text-align: center;
            width: 360px;
            border-top: 5px solid #CAA347;
            box-sizing: border-box;
            touch-action: none;
            margin-bottom: 20px; 
        }

        .logo-placeholder {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #FFDF92 0%, #CAA347 100%);
            border-radius: 50%;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Amiri', 'Traditional Arabic', 'Segoe UI', serif;
            font-size: 26px;
            color: #E23D28;
            font-weight: bold;
            direction: rtl;
            box-shadow: 0 0 20px rgba(202, 163, 71, 0.4);
        }

        .station-title {
            margin: 5px 0;
            font-size: 25px;
            color: #FFFFF4;
            font-weight: 600;
        }

        .station-sub {
            margin: 0 0 12px 0;
            font-size: 11px;
            color: #EDDDB8;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: 500;
        }

        /* TOMBOL UTAMA BYPASS KECERDASAN AUDIO ANDROID */
        .play-btn {
            background: linear-gradient(135deg, #CAA347 0%, #A37F2C 100%);
            color: #0e0e0e;
            border: 1px solid #FFDF92;
            padding: 14px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(202, 163, 71, 0.4);
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .play-btn:active {
            transform: scale(0.98);
        }
        .play-btn.playing {
            background: linear-gradient(135deg, #E23D28 0%, #A82414 100%);
            color: #ffffff;
            border: 1px solid #FFA399;
            box-shadow: 0 4px 15px rgba(226, 61, 40, 0.4);
        }

        /* Status Loading Saat Koneksi Mengudara */
        .status-text {
            font-size: 12px;
            color: #EDDDB8;
            margin-top: -12px;
            margin-bottom: 15px;
            font-weight: bold;
            display: none;
        }

        .info-text-container {
            width: 310px; 
            height: 330px; /* Sedikit disesuaikan agar proporsional dengan tombol baru */
            overflow-y: auto; 
            overflow-x: hidden;
            text-align: justify; 
            font-size: 16px;
            line-height: 1.3; 
            color: #FFFFF4;
            word-wrap: break-word;
            white-space: normal;
            padding: 0 15px; 
            box-sizing: border-box; 
            user-select: text;
            touch-action: pan-y;
        }

        .info-text-container p {
            margin: 0 0 4px 0; 
            min-height: 20.8px;
        }

        .info-text-container p:last-child {
            margin-bottom: 0;
        }

        .info-text-container::-webkit-scrollbar {
            width: 4px;
        }

        .info-text-container::-webkit-scrollbar-thumb {
            background: #CAA347;
            border-radius: 10px;
        }

        .dev-tag {
            text-align: center;
            font-size: 13px;
            color: #EDDDB8;
            margin-top: 15px;
            width: 310px;
            font-weight: 400;
            letter-spacing: 0.5px;
            user-select: none;
        }
    </style>
</head>
<body>

    <!-- Kartu Pemutar Utama -->
    <div class="player-card">
        <div class="logo-placeholder">رَائِس</div>
        <h2 class="station-title">Radio Islam Sragen</h2>
        <p class="station-sub">Lantunan Murotal dan Kajian Islam Ilmiah</p>
        
        <!-- PEMUTAR UTAMA (Gunakan Native HTML5 Audio Bypass Sistem Android) -->
        <button id="radioControl" class="play-btn" onclick="toggleRadio()">
            <span id="btnIcon">▶</span> <span id="btnText">PUTAR RADIO</span>
        </button>
        <div id="statusIndicator" class="status-text">Menghubungkan ke siaran...</div>
        
        <!-- Element Audio Tersembunyi (Tanpa Iframe) -->
        <audio id="audioPlayer" preload="none"></audio>

        <!-- AREA TEKS DI DALAM KARTU PEMUTAR BAGIAN BAWAH -->
        <div class="info-text-container">
            <p>══════📻🆁🅰🅸🆂</p>
            <p></p>
            <p>📚 Qasidah</p> 
            <p>   Unwanulhikam</p> 
            <p>🎙 Al-Ustadz Usamah</p>
        </div>
        
        <!-- Tag Developer -->
        <div class="dev-tag">@dev.afcom</div>
    </div>

    <!-- JAVASCRIPT REVOLUSIONER UNTUK BYPASS AUDIO NATIVE ANDROID -->
    <script>
        let isPlaying = false;
        const audio = document.getElementById('audioPlayer');
        const btn = document.getElementById('radioControl');
        const btnIcon = document.getElementById('btnIcon');
        const btnText = document.getElementById('btnText');
        const statusText = document.getElementById('statusIndicator');

        // URL Direct Audio Stream dari server Streamy1 Radio Islam Sragen Anda
        const directStreamUrl = "https://radioislam.my.id";

        function toggleRadio() {
            if (!isPlaying) {
                statusText.style.display = "block";
                statusText.innerText = "Menghubungkan ke siaran...";
                
                // Set source langsung ke audio native (Bukan Iframe)
                audio.src = directStreamUrl;
                audio.load();
                
                // Jalankan audio lewat interaksi ketukan jari resmi pengguna Android
                audio.play()
                .then(() => {
                    statusText.innerText = "• LIVE MENGUDARA";
                    btnText.innerText = "HENTIKAN RADIO";
                    btnIcon.innerText = "⏹";
                    btn.classList.add('playing');
                    isPlaying = true;
                })
                .catch(error => {
                    console.error("Playback error:", error);
                    statusText.innerText = "Gagal memuat siaran. Coba lagi.";
                });

            } else {
                // Hentikan siaran total dan kosongkan buffer agar hemat kuota data Android
                audio.pause();
                audio.src = ""; 
                statusText.style.display = "none";
                btnText.innerText = "PUTAR RADIO";
                btnIcon.innerText = "▶";
                btn.classList.remove('playing');
                isPlaying = false;
            }
        }

        // Monitoring jika stream terputus di tengah jalan
        audio.addEventListener('waiting', () => {
            if(isPlaying) statusText.innerText = "Buffering / Memuat ulang...";
        });
        audio.addEventListener('playing', () => {
            if(isPlaying) statusText.innerText = "• LIVE MENGUDARA";
        });
    </script>

</body>
</html>
