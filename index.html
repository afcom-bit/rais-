<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Radio Islam Sragen</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1b4d3e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0e0e0e 0%, #1b4d3e 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 10px;
            overflow: hidden !important;
            position: fixed;
            touch-action: none;
            user-select: none;
            box-sizing: border-box;
        }

        .player-card {
            background:
                linear-gradient(
                    135deg,
                    rgba(255, 255, 255, 0.28) 0%,
                    rgba(255, 255, 255, 0.08) 40%,
                    rgba(255, 255, 255, 0.35) 45%,
                    rgba(255, 255, 255, 0.05) 52%,
                    rgba(255, 255, 255, 0.15) 100%
                ),
                rgba(255, 255, 255, 0.22);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            border: 1px solid rgba(255, 255, 244, 0.6);

            padding: 25px;
            border-radius: 20px;

            box-shadow:
                inset 0 1px 2px rgba(255, 255, 255, 0.6),
                inset 0 -1px 2px rgba(255, 255, 255, 0.2),
                0 10px 25px rgba(0,0,0,0.5),
                0 0 18px 2px rgba(255, 255, 255, 0.18);

            text-align: center;
            width: 360px;

            border-top: 5px solid #F8FFFD;

            box-sizing: border-box;
            touch-action: none;
            margin-bottom: 20px;
        }

        /* ==============================
           AREA LOGO
        ============================== */

        .logo-area {
            position: relative;
            width: 100%;
            height: 250px;
            margin-bottom: 20px;
        }

        .logo-placeholder {
            position: absolute;
            width: calc(100% + 10px);
            height: 250px;
            left: -5px;
            top: 5px;

            background: linear-gradient(
                135deg,
                #FFDF92 0%,
                #CAA347 100%
            );

            border-radius: 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            box-shadow:
                0 0 20px rgba(202, 163, 71, 0.4);

            z-index: 1;
        }

        .logo-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* ==============================
           RAIS DI ATAS LOGO
        ============================== */

        .station-sub {
            position: absolute;
            left: 0;
            right: 0;
            top: -14px;

            margin: 0;

            font-size: 14px;
            line-height: 14px;

            color: #F8FFFD;

            font-family:
                'Segoe UI',
                Tahoma,
                Geneva,
                Verdana,
                sans-serif;

            font-weight: 600;

            z-index: 3;
            text-align: center;
        }

        /* ==============================
           FRAME GAYA HP ANDROID
        ============================== */

        .iframe-container {
            position: absolute;

            left: 0;
            bottom: 5px;

            width: 100%;
            height: 83px;

            border-radius: 18px;

            overflow: hidden !important;

            background: #111 !important;

            border: 2px solid #222;

            box-shadow:
                inset 0 0 0 1px rgba(255,255,255,0.15),
                0 3px 10px rgba(0,0,0,0.55);

            z-index: 4;

            --crop-left: -50px;
            --crop-top: -135px;
        }

        /* Kamera / sensor HP */
        .iframe-container::before {
            content: "";

            position: absolute;

            top: 5px;
            left: 50%;

            transform: translateX(-50%);

            width: 35px;
            height: 5px;

            background: #050505;

            border-radius: 10px;

            box-shadow:
                0 0 0 1px rgba(255,255,255,0.08);

            z-index: 20;

            pointer-events: none;
        }

        iframe {
            position: absolute;

            width: 480px;
            height: 445px;

            border: none;

            overflow: hidden !important;

            touch-action: none;

            left: var(--crop-left);
            top: var(--crop-top);

            z-index: 5;
        }

        /* ==============================
           INFORMASI
        ============================== */

        .info-text-container {
            width: 310px;
            height: auto;
            max-height: 352px;

            overflow-y: auto;
            overflow-x: hidden;

            text-align: justify;

            font-size: 16px;
            line-height: 1.3;

            color: #FFFFF4;

            word-wrap: break-word;
            white-space: normal;

            padding: 0 15px;

            box-sizing: border-box;

            user-select: text;
            touch-action: pan-y;
        }

        .info-text-container p {
            margin: 0 0 4px 0;
            min-height: 20.8px;
        }

        .info-text-container p:last-child {
            margin-bottom: 0;
        }

        .info-text-container::-webkit-scrollbar {
            width: 4px;
        }

        .info-text-container::-webkit-scrollbar-thumb {
            background: #CAA347;
            border-radius: 10px;
        }

        /* ==============================
           DEVELOPER
        ============================== */

        .dev-tag {
            text-align: center;

            font-size: 13px;

            color: #EDDDB8;

            margin-top: 21px;

            width: 310px;

            font-weight: 400;

            letter-spacing: 0.5px;

            user-select: none;
        }
    </style>
</head>

<body>

    <div class="player-card">

        <div class="logo-area">

            <div class="logo-placeholder">
                <img
                    src="./icon-192.png"
                    alt="Radio Islam Sragen">
            </div>

            <p class="station-sub">
                RAIS
            </p>

            <div class="iframe-container">

                <iframe
                    src="https://streamy1.radioislam.my.id/player/sragen-s-station/"
                    allow="autoplay; encrypted-media"
                    scrolling="no"
                    title="Streamy Player">
                </iframe>

            </div>

        </div>


        <div class="info-text-container">

            <p>══════📻🆁🅰🅸🆂</p>

            <p></p>

            <p>📚 Qasidah</p>

            <p>   Unwanulhikam</p>

            <p>🎙 Al-Ustadz&nbsp; Usamah&nbsp; bin</p>

            <p>   Faishol Mahri&nbsp; حفظه ا لله</p>

            <p></p>

            <p>📚 Tausiyah</p>

            <p>🎙 Al-Ustadz Huda حفظه ا لله</p>

            <p></p>

            <p>📌 Masjid Alfalah,&nbsp;Sragen</p>

            <p>   Ahad Tgl 20 Juli 2025</p>

            <p></p>
            <p></p>
            <p></p>
            <p></p>
            <p></p>

        </div>


        <div class="dev-tag">
            dev.@fcom
        </div>

    </div>


    <script>

        function rapikanTextContainer() {

            const container =
                document.querySelector('.info-text-container');

            if (!container) return;

            const paragraphs =
                Array.from(
                    container.querySelectorAll('p')
                );

            let lastFilled = -1;

            for (
                let i = 0;
                i < paragraphs.length;
                i++
            ) {

                const teks =
                    paragraphs[i].textContent.trim();

                if (teks !== '') {
                    lastFilled = i;
                }
            }

            paragraphs.forEach(
                (p, index) => {

                    if (index > lastFilled) {

                        p.style.display = 'none';

                    } else {

                        p.style.display = '';

                    }

                }
            );

            container.style.height = 'auto';

            const tinggi =
                container.scrollHeight;

            if (tinggi > 352) {

                container.style.height =
                    '352px';

            } else {

                container.style.height =
                    tinggi + 'px';

            }

        }


        document.addEventListener(
            'DOMContentLoaded',
            function() {

                rapikanTextContainer();

            }
        );


        document.addEventListener(
            'touchmove',
            function(e) {

                if (
                    e.target.closest(
                        '.info-text-container'
                    )
                ) {
                    return;
                }

                if (e.scale !== 1) {
                    e.preventDefault();
                }

            },
            {
                passive: false
            }
        );


        if ('serviceWorker' in navigator) {

            window.addEventListener(
                'load',
                () => {

                    navigator.serviceWorker
                        .register('./sw.js')

                        .then(
                            reg =>
                                console.log(
                                    'PWA Manual Crop Sukses Diaktifkan!'
                                )
                        )

                        .catch(
                            err =>
                                console.log(
                                    'PWA Gagal:',
                                    err
                                )
                        );

                }
            );

        }

    </script>

</body>
</html>
