<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Radio Islam Sragen</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1b4d3e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0e0e0e 0%, #1b4d3e 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* Diubah ke center agar HP pas di tengah */
            overflow: hidden !important;
            position: fixed;
            touch-action: none;
            user-select: none;
            box-sizing: border-box;
        }

        /* FRAME BINGKAI HP ANDROID */
        .android-device {
            position: relative;
            width: 390px; /* Sedikit lebih lebar dari card player */
            height: 780px; /* Proporsi panjang HP modern */
            background: #151515; /* Warna fisik casing HP */
            border: 12px solid #2d2d2d; /* Bezel luar HP */
            border-radius: 40px; /* Sudut melengkung khas Android */
            box-shadow: 
                0 25px 50px -12px rgba(0, 0, 0, 0.7),
                inset 0 2px 3px rgba(255,255,255,0.2),
                inset 0 -2px 3px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 35px; /* Memberi ruang untuk Notch/Kamera atas */
            box-sizing: border-box;
            overflow: hidden;
        }

        /* KAMERA DAN SPEAKER ATAS (NOTCH) */
        .android-notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 140px;
            height: 25px;
            background: #2d2d2d;
            border-bottom-left-radius: 15px;
            border-bottom-right-radius: 15px;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .android-speaker {
            width: 40px;
            height: 4px;
            background: #555;
            border-radius: 2px;
        }

        .android-camera {
            width: 8px;
            height: 8px;
            background: #111;
            border-radius: 50%;
            border: 1px solid #444;
        }

        /* DAERAH LAYAR UTAMA DI DALAM HP */
        .player-card {
            background:
                linear-gradient(
                    135deg,
                    rgba(255, 255, 255, 0.28) 0%,
                    rgba(255, 255, 255, 0.08) 40%,
                    rgba(255, 255, 255, 0.35) 45%,
                    rgba(255, 255, 255, 0.05) 52%,
                    rgba(255, 255, 255, 0.15) 100%
                ),
                rgba(255, 255, 255, 0.22);

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            border: 1px solid rgba(255, 255, 244, 0.6);

            padding: 25px;
            border-radius: 25px; /* Disesuaikan agar serasi dengan lengkungan HP */

            box-shadow:
                inset 0 1px 2px rgba(255, 255, 255, 0.6),
                inset 0 -1px 2px rgba(255, 255, 255, 0.2),
                0 10px 25px rgba(0,0,0,0.5),
                0 0 18px 2px rgba(255, 255, 255, 0.18);

            text-align: center;
            width: 350px; /* Sedikit disesuaikan agar pas di dalam frame */

            border-top: 5px solid #F8FFFD;

            box-sizing: border-box;
            touch-action: none;
            margin-top: 10px;
            margin-bottom: 10px;
        }

        .logo-area {
            position: relative;
            width: 100%;
            height: 250px;
            margin-bottom: 20px;
        }

        .logo-placeholder {
            position: absolute;
            width: calc(100% + 10px);
            height: 250px;
            left: -5px;
            top: 5px;

            background: linear-gradient(
                135deg,
                #FFDF92 0%,
                #CAA347 100%
            );

            border-radius: 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            box-shadow:
                0 0 20px rgba(202, 163, 71, 0.4);

            z-index: 1;
        }

        .logo-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .station-sub {
            position: absolute;
            left: 0;
            right: 0;
            top: -14px;

            margin: 0;

            font-size: 14px;
            line-height: 14px;

            color: #F8FFFD;

            font-family:
                'Segoe UI',
                Tahoma,
                Geneva,
                Verdana,
                sans-serif;

            font-weight: 600;

            z-index: 3;
            text-align: center;
        }

        .iframe-container {
            position: absolute;
            left: 0;
            bottom: 5px;

            width: 100%;
            height: 83px;

            border-radius: 12px;

            overflow: hidden !important;

            background: transparent !important;

            border: 1px solid rgba(255, 255, 254, 0.4);

            z-index: 4;

            --crop-left: -50px;
            --crop-top: -135px;
        }

        iframe {
            position: absolute;

            width: 480px;
            height: 445px;

            border: none;

            overflow: hidden !important;
            touch-action: none;

            left: var(--crop-left);
            top: var(--crop-top);

            z-index: 5;
        }

        .info-text-container {
            width: 300px;
            height: auto;
            max-height: 260px; /* Disesuaikan sedikit agar pas dengan rasio tinggi layar HP */

            overflow-y: auto;
            overflow-x: hidden;

            text-align: justify;

            font-size: 16px;
            line-height: 1.3;

            color: #FFFFF4;

            word-wrap: break-word;
            white-space: normal;

            padding: 0 15px;

            box-sizing: border-box;

            user-select: text;
            touch-action: pan-y;
        }

        .info-text-container p {
            margin: 0 0 4px 0;
            min-height: 20.8px;
        }

        .info-text-container p:last-child {
            margin-bottom: 0;
        }

        .info-text-container::-webkit-scrollbar {
            width: 4px;
        }

        .info-text-container::-webkit-scrollbar-thumb {
            background: #CAA347;
            border-radius: 10px;
        }

        .dev-tag {
            text-align: center;
            font-size: 13px;
            color: #EDDDB8;
            margin-top: 15px;
            width: 300px;
            font-weight: 400;
            letter-spacing: 0.5px;
            user-select: none;
        }

        /* TOMBOL NAVIGASI BAWAH ANDROID (GARIS/HOME BAR) */
        .android-navbar {
            position: absolute;
            bottom: 10px;
            width: 120px;
            height: 5px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 3px;
            z-index: 10;
        }
    </style>
</head>

            if (!container) return;
