<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#1b4d3e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <title>Radio Islam Sragen</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      overflow: hidden;
      color: #fff;
      background: linear-gradient(135deg, #0e0e0e, #1b4d3e);
      transition: background .3s ease;
    }

    body.light-theme {
      background: linear-gradient(135deg, #91c9b2, #f5e5bc);
    }

    .android-phone {
      position: relative;
      width: min(360px, 100%);
      background: linear-gradient(145deg, #cfefe0, #e8f5e9 50%, #fff3d6);
      border: 3px solid #d8cbaa;
      border-radius: 42px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,.6), inset 0 0 20px rgba(255,255,255,.35);
    }

    .phone-top {
      position: relative;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .speaker {
      width: 62px;
      height: 8px;
      border-radius: 8px;
      background: linear-gradient(#303030, #090909);
      box-shadow: inset 0 1px 2px rgba(255,255,255,.25);
    }

    .front-camera {
      position: absolute;
      top: 17px;
      left: calc(50% + 45px);
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #536b76, #101719 60%, #000);
    }

    .phone-screen {
      width: calc(100% - 10px);
      margin: 0 auto;
      padding: 10px 0;
      border-radius: 20px;
      overflow: hidden;
      background: linear-gradient(135deg, #0e0e0e, #1b4d3e);
      box-shadow: inset 0 0 0 2px rgba(0,0,0,.55), inset 0 0 12px rgba(0,0,0,.45);
      transition: background .3s ease;
    }

    body.light-theme .phone-screen {
      background: linear-gradient(135deg, #3d806a, #89bda6);
    }

    .player-card {
      width: 100%;
      padding: 25px;
      border: 1px solid rgba(255,255,244,.6);
      border-radius: 20px;
      text-align: center;
      background:
        linear-gradient(135deg,
          rgba(255,255,255,.28),
          rgba(255,255,255,.08) 40%,
          rgba(255,255,255,.35) 45%,
          rgba(255,255,255,.05) 52%,
          rgba(255,255,255,.15)),
        rgba(255,255,255,.22);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: inset 0 1px 2px rgba(255,255,255,.6), 0 10px 25px rgba(0,0,0,.5);
      transition: background .3s ease;
    }

    body.light-theme .player-card {
      background:
        linear-gradient(135deg,
          rgba(255,255,255,.62),
          rgba(255,255,255,.22) 48%,
          rgba(255,255,255,.45)),
        rgba(242,255,249,.26);
      border-color: rgba(255,255,255,.78);
    }

    .logo-area {
      position: relative;
      height: 250px;
      margin-bottom: 20px;
    }

    .logo-placeholder {
      position: absolute;
      top: 5px;
      left: -5px;
      width: calc(100% + 10px);
      height: 250px;
      overflow: hidden;
      border-radius: 15px;
      background: linear-gradient(135deg, #ffdf92, #caa347);
      box-shadow: 0 0 20px rgba(202,163,71,.4);
    }

    .logo-placeholder img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .station-sub {
      position: absolute;
      z-index: 3;
      top: -14px;
      right: 0;
      left: 0;
      margin: 0;
      color: #f8fffd;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
    }

    .iframe-container {
      position: absolute;
      z-index: 4;
      bottom: 5px;
      left: 0;
      width: 100%;
      height: 83px;
      overflow: hidden;
      border: 1px solid rgba(255,255,254,.4);
      border-radius: 12px;
    }

    iframe {
      position: absolute;
      top: -135px;
      left: -50px;
      width: 480px;
      height: 445px;
      border: 0;
    }

    .info-text-container {
      max-height: 352px;
      overflow-y: auto;
      padding: 0 15px;
      color: #fffff4;
      font-size: 16px;
      line-height: 1.3;
      text-align: justify;
    }

    .info-text-container p {
      margin: 0 0 4px;
    }

    .dev-tag {
      margin-top: 21px;
      color: #edddb8;
      font-size: 13px;
      letter-spacing: .5px;
      text-align: center;
    }

    .phone-bottom {
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 42px;
    }

    .nav-button, .home-button {
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform .12s;
    }

    .nav-button:active, .home-button:active {
      transform: scale(.92);
    }

    .nav-button {
      width: 28px;
      height: 28px;
      border: 1px solid rgba(120,140,125,.55);
      border-radius: 50%;
      background: linear-gradient(145deg, #e8f5e9, #cfefe0);
      box-shadow: inset 0 1px 2px rgba(255,255,255,.8), 0 2px 4px rgba(0,0,0,.35);
    }

    .nav-button.left::before {
      content: "☰";
      color: #315546;
      font-size: 15px;
    }

    .nav-button.theme::before {
      content: "☼";
      color: #315546;
      font-size: 20px;
      font-weight: 600;
    }

    body.light-theme .nav-button.theme::before {
      content: "☾";
    }

    .home-button {
      width: 62px;
      height: 32px;
      border: 1px solid rgba(130,115,85,.65);
      border-radius: 10px;
      background: linear-gradient(145deg, #fff3d6, #d8cbaa);
      box-shadow: inset 0 1px 2px rgba(255,255,255,.9), 0 2px 5px rgba(0,0,0,.35);
    }

    .home-inner {
      width: 13px;
      height: 13px;
      border: 2px solid #8c8062;
      border-radius: 3px;
    }

    .menu-overlay {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: none;
      background: rgba(0,0,0,.55);
    }

    .menu-overlay.active {
      display: block;
    }

    .popup {
      position: fixed;
      z-index: 1000;
      top: 50%;
      left: 50%;
      display: none;
      width: min(300px, calc(100vw - 32px));
      padding: 20px;
      color: #244438;
      text-align: center;
      background: linear-gradient(145deg, #cfefe0, #fff3d6);
      border: 2px solid #d8cbaa;
      border-radius: 22px;
      box-shadow: 0 15px 45px rgba(0,0,0,.65);
      transform: translate(-50%, -50%);
    }

    .popup.active {
      display: block;
    }

    .popup-title {
      margin-bottom: 15px;
      font-size: 18px;
      font-weight: 700;
    }

    .popup-content {
      padding: 10px;
      text-align: left;
      white-space: pre-line;
      background: rgba(255,255,255,.75);
      border: 1px solid #9ead9d;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.4;
    }

    .popup-button {
      width: 100%;
      height: 42px;
      margin-top: 8px;
      color: #244438;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(145deg, #e8f5e9, #fff3d6);
      border: 0;
      border-radius: 12px;
    }
  </style>
</head>

<body>
  <div class="android-phone">
    <div class="phone-top">
      <div class="speaker"></div>
      <div class="front-camera"></div>
    </div>

    <div class="phone-screen">
      <div class="player-card">
        <div class="logo-area">
          <div class="logo-placeholder">
            <img src="./icon-192.png" alt="Radio Islam Sragen">
          </div>

          <p class="station-sub">RAIS</p>

          <div class="iframe-container">
            <iframe
              src="https://streamy1.radioislam.my.id/player/sragen-s-station/"
              allow="autoplay; encrypted-media"
              scrolling="no"
              title="Streamy Player">
            </iframe>
          </div>
        </div>

        <div class="info-text-container" id="infoText"></div>
        <div class="dev-tag">dev.@fcom</div>
      </div>
    </div>

    <div class="phone-bottom">
      <div class="nav-button left" id="shareButton" title="Bagikan"></div>

      <div class="home-button" id="homeButton" title="Informasi">
        <div class="home-inner"></div>
      </div>

      <div class="nav-button theme" id="themeButton" title="Ganti tema"></div>
    </div>
  </div>

  <div class="menu-overlay" id="menuOverlay"></div>

  <div class="popup" id="shareMenu">
    <div class="popup-title">Bagikan Radio Islam Sragen</div>
    <button class="popup-button" id="systemShare">📤 Bagikan Link</button>
    <button class="popup-button" id="copyLink">🔗 Salin Link</button>
    <button class="popup-button" id="closeShare">✕ Tutup</button>
  </div>

  <div class="popup" id="infoMenu">
    <div class="popup-title">Informasi Radio</div>
    <div class="popup-content" id="infoContent"></div>
    <button class="popup-button" id="closeInfo">✕ Tutup</button>
  </div>

  <script>
    /* Ubah teks informasi tetap di sini. */
    const informasiRadio = [
      "Radio Islam Sragen (RAIS)",
      "Dengarkan siaran Radio Islam Sragen secara langsung.",
      "Gunakan tombol bagikan untuk mengirimkan link radio kepada keluarga dan sahabat."
    ];

    const overlay = document.getElementById("menuOverlay");
    const shareMenu = document.getElementById("shareMenu");
    const infoMenu = document.getElementById("infoMenu");

    function tampilkanInfoDiHalaman() {
      const wadah = document.getElementById("infoText");
      wadah.innerHTML = "";

      informasiRadio.forEach(teks => {
        const paragraf = document.createElement("p");
        paragraf.textContent = teks;
        wadah.appendChild(paragraf);
      });
    }

    function tutupSemuaMenu() {
      overlay.classList.remove("active");
      shareMenu.classList.remove("active");
      infoMenu.classList.remove("active");
    }

    document.getElementById("shareButton").addEventListener("click", () => {
      shareMenu.classList.add("active");
      overlay.classList.add("active");
    });

    document.getElementById("homeButton").addEventListener("click", () => {
      document.getElementById("infoContent").textContent = informasiRadio.join("\n\n");
      infoMenu.classList.add("active");
      overlay.classList.add("active");
    });

    document.getElementById("closeShare").addEventListener("click", tutupSemuaMenu);
    document.getElementById("closeInfo").addEventListener("click", tutupSemuaMenu);
    overlay.addEventListener("click", tutupSemuaMenu);

    document.getElementById("themeButton").addEventListener("click", () => {
      const temaBaru = document.body.classList.contains("light-theme")
        ? "dark"
        : "light";

      document.body.classList.toggle("light-theme", temaBaru === "light");
      localStorage.setItem("rais-theme", temaBaru);
    });

    document.getElementById("systemShare").addEventListener("click", async () => {
      const data = {
        title: "Radio Islam Sragen",
        text: "Dengarkan Radio Islam Sragen",
        url: window.location.href
      };

      try {
        if (navigator.share) {
          await navigator.share(data);
        } else {
          await navigator.clipboard.writeText(data.url);
          alert("Link berhasil disalin.");
        }
      } catch (error) {
        console.log("Bagikan dibatalkan.");
      }
    });

    document.getElementById("copyLink").addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(window.location.href);
        alert("Link berhasil disalin.");
      } catch (error) {
        prompt("Salin link berikut:", window.location.href);
      }
    });

    document.addEventListener("DOMContentLoaded", () => {
      const temaTersimpan = localStorage.getItem("rais-theme") || "dark";
      document.body.classList.toggle("light-theme", temaTersimpan === "light");
      tampilkanInfoDiHalaman();
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js")
          .catch(error => console.log("PWA gagal:", error));
      });
    }
  </script>
</body>
</html>
